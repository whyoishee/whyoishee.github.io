<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff4f8">
<title>Oishee · Birthday Countdown</title>
<style>
:root{--deep:#9d326b;--ink:#38253c;--glass:rgba(255,255,255,.76)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 12% 12%,rgba(255,205,225,.8),transparent 34%),radial-gradient(ellipse at 90% 18%,rgba(213,204,255,.8),transparent 33%),radial-gradient(ellipse at 52% 100%,rgba(255,230,209,.65),transparent 38%),linear-gradient(145deg,#fffafd,#fff5f8 50%,#f7f3ff)}
.ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.44;animation:float 10s ease-in-out infinite}.orb:nth-child(1){width:230px;height:230px;background:#ffc9df;top:5%;left:-85px}.orb:nth-child(2){width:190px;height:190px;background:#d6c7ff;right:-70px;top:43%;animation-delay:-3s}.orb:nth-child(3){width:130px;height:130px;background:#ffe4ac;left:18%;bottom:-55px;animation-delay:-5s}
@keyframes float{50%{transform:translateY(-22px) translateX(10px)}}
main{position:relative;z-index:1;width:min(100% - 28px,900px);margin:0 auto;padding:34px 0 44px;text-align:center}
.eyebrow{display:inline-flex;gap:9px;align-items:center;padding:9px 15px;border:1px solid #f6d5e3;border-radius:99px;background:rgba(255,255,255,.68);font-size:.75rem;letter-spacing:.11em;text-transform:uppercase;color:#a64c7a;font-weight:800;box-shadow:0 5px 20px #9d326b0b}
h1{font-size:clamp(2.6rem,8vw,5.4rem);line-height:1.02;letter-spacing:-.065em;margin:23px 0 12px;color:#9d326b;font-weight:850;text-wrap:balance}.subtitle{font-size:clamp(1rem,2.6vw,1.18rem);line-height:1.65;margin:0 auto 22px;max-width:620px;color:#866a82}.cake-stage{height:156px;display:grid;place-items:center;position:relative;margin:7px auto 6px;isolation:isolate}.cake-stage:before{content:"";position:absolute;z-index:-1;width:clamp(150px,48vw,270px);height:clamp(100px,29vw,155px);border-radius:50%;background:radial-gradient(ellipse,rgba(255,151,204,.52) 0%,rgba(226,194,255,.30) 42%,rgba(255,255,255,0) 72%);filter:blur(13px);animation:cakeglow 3.6s ease-in-out infinite}.cake-stage:after{content:"✦  ·  ✧  ·  ✦";position:absolute;z-index:-1;top:12px;left:50%;transform:translateX(-50%);width:100%;color:rgba(185,116,173,.7);font-size:clamp(1rem,4vw,1.5rem);letter-spacing:.7em;white-space:nowrap;pointer-events:none;animation:twinkle 3s ease-in-out infinite}.cake{font-size:clamp(5.4rem,17vw,8rem);filter:drop-shadow(0 12px 12px #bd4c7b25);animation:cakebob 3.2s ease-in-out infinite}@keyframes cakebob{50%{transform:translateY(-7px) rotate(2deg)}}@keyframes cakeglow{50%{opacity:.62;transform:scale(1.12)}}@keyframes twinkle{50%{opacity:.35;letter-spacing:.85em}}
.age-badge{position:absolute;right:calc(50% - 105px);top:9px;transform:rotate(7deg);background:rgba(255,255,255,.94);border:1px solid #f4c3d9;border-radius:15px;padding:8px 13px;font-weight:850;color:#a43a73;box-shadow:0 7px 18px #a43a731c}
.card{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.95);box-shadow:0 20px 60px rgba(137,62,103,.10),inset 0 1px rgba(255,255,255,.95);border-radius:28px;padding:clamp(18px,4vw,34px);backdrop-filter:blur(18px);max-width:760px;margin:0 auto}
.timer-label{font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;color:#a66a8a;font-weight:850}.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(6px,2vw,12px);margin:22px 0 10px}
.time-box{position:relative;padding:clamp(14px,3vw,22px) 4px clamp(12px,2.5vw,17px);background:linear-gradient(155deg,rgba(255,255,255,.98),rgba(255,242,248,.88));border:1px solid #f5dce8;border-radius:clamp(14px,3vw,22px);min-width:0;box-shadow:0 8px 22px rgba(164,58,115,.07),inset 0 1px white;overflow:hidden}.time-box:before{content:"";position:absolute;top:0;left:18%;right:18%;height:3px;border-radius:0 0 6px 6px;background:linear-gradient(90deg,#f7a6c8,#c5a9ff);opacity:.9}
.number{display:block;font-variant-numeric:tabular-nums;font-size:clamp(1.55rem,6.2vw,3.35rem);font-weight:850;line-height:1.1;color:#a33e76;letter-spacing:-.055em;white-space:nowrap}.unit{display:block;margin-top:9px;font-size:clamp(.55rem,1.8vw,.7rem);letter-spacing:.1em;text-transform:uppercase;color:#a27b96;font-weight:800}
.date-line{font-size:clamp(.78rem,2.5vw,.93rem);line-height:1.5;color:#97778f;margin:17px 0 0}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:22px 0 0}button{font:inherit;font-size:.91rem;font-weight:750;border:0;border-radius:14px;padding:13px 17px;cursor:pointer;transition:transform .18s,box-shadow .18s;background:white}button:hover{transform:translateY(-2px);box-shadow:0 10px 25px #a33e761e}.primary{background:linear-gradient(135deg,#f47caf,#d94f91);color:white;box-shadow:0 8px 18px #e45a9b2e}.secondary{background:rgba(255,255,255,.86);color:#9d326b;border:1px solid #f1d4e2}
.music-note{font-size:.79rem;color:#a18a9c;margin-top:13px}.footer{font-size:.8rem;color:#aa91a4;margin:20px 0 0}
.controls{margin:24px auto 0;max-width:600px;text-align:left;background:#ffffffa8;border:1px solid #f1d4e2;border-radius:20px;padding:17px;box-shadow:0 10px 30px #8d4c710b}.controls summary{cursor:pointer;font-weight:800;color:#9d326b}.controls-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:15px}
label{font-size:.82rem;font-weight:750;color:#8f6b85;display:grid;gap:7px}input,select{width:100%;min-width:0;padding:11px 12px;border:1px solid #ead2e0;border-radius:11px;background:#fff;color:#38253c;font:inherit}.control-help{font-size:.78rem;color:#9b8195;line-height:1.6;margin:13px 0 0}
.confetti{position:fixed;top:-40px;z-index:5;pointer-events:none;font-size:clamp(20px,4vw,34px);animation:fall linear forwards;filter:drop-shadow(0 3px 2px #8e3b6c15)}@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(720deg);opacity:.15}}
.side-pop{position:fixed;z-index:6;top:18%;font-size:clamp(1.8rem,5vw,3.3rem);animation:slidepop 1.3s ease-out forwards;pointer-events:none}.side-pop.left{left:-100px}.side-pop.right{right:-100px}@keyframes slidepop{0%{transform:translateX(0) scale(.5);opacity:0}25%{opacity:1}65%{transform:translateX(var(--move)) scale(1.2);opacity:1}100%{transform:translateX(var(--move)) scale(.9);opacity:0}}
body.celebrating{background:radial-gradient(ellipse at 50% 12%,rgba(255,229,166,.9),transparent 27%),radial-gradient(ellipse at 12% 45%,rgba(255,177,217,.86),transparent 35%),radial-gradient(ellipse at 90% 68%,rgba(194,180,255,.8),transparent 34%),linear-gradient(145deg,#fff9ef,#ffe8f2 52%,#f0eaff 100%)}body.celebrating h1{background:linear-gradient(90deg,#c83d7d,#8c62d8,#df9d38);background-clip:text;-webkit-background-clip:text;color:transparent}body.celebrating .card{box-shadow:0 25px 80px #d94b8b22,inset 0 1px #fff}body.celebrating .card{display:none!important}body.celebrating .cake-stage:before{background:radial-gradient(ellipse,rgba(255,184,93,.62) 0%,rgba(255,153,208,.42) 42%,rgba(218,196,255,0) 74%);filter:blur(16px)}
@media(max-width:520px){
      main{width:calc(100% - 24px);padding-top:22px}
      .cake-stage{height:132px;margin:4px auto 10px}.cake-stage:after{top:9px;letter-spacing:.42em}.cake-stage:before{width:190px;height:110px}
      .age-badge{right:calc(50% - 93px);top:5px;padding:7px 10px;font-size:.85rem}
      .card{padding:18px 12px 20px;border-radius:24px}
      .timer{gap:7px;margin:18px 0 8px}
      .time-box{padding:15px 2px 13px;border-radius:15px}
      .number{font-size:clamp(1.42rem,7.1vw,2.35rem);letter-spacing:-.06em}
      .unit{font-size:clamp(.5rem,2vw,.64rem);letter-spacing:.06em;margin-top:8px}
      .date-line{margin-top:15px}
    }
    @media(max-width:350px){
      main{width:calc(100% - 16px)}
      .card{padding:15px 8px 17px}
      .timer{gap:5px}
      .time-box{padding:13px 1px 11px}
      .number{font-size:1.32rem}
      .unit{font-size:.48rem;letter-spacing:.03em}
    }
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}

@media (max-width: 600px) {
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  main {
    width: min(100% - 24px, 520px);
    margin: auto;
    padding-top: 20px;
    padding-bottom: 20px;
  }
}

</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
<main>
  <h1 id="headline">Oishee's Birthday countdown</h1>

  <div class="cake-stage" aria-label="Birthday cake">
    <div class="cake" id="cake">🎂</div>
    <div class="age-badge" id="ageBadge">currently 17y</div>
  </div>

  <section class="card" aria-live="polite">
    <div class="timer" id="timer">
      <div class="time-box"><span class="number" id="days">000</span><span class="unit">Days</span></div>
      <div class="time-box"><span class="number" id="hours">00</span><span class="unit">Hours</span></div>
      <div class="time-box"><span class="number" id="minutes">00</span><span class="unit">Minutes</span></div>
      <div class="time-box"><span class="number" id="seconds">00</span><span class="unit">Seconds</span></div>
    </div>
    <p class="date-line" id="dateLine">Next birthday: October 1</p>
  </section>
</main>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const MONTH = 9; // October
  const BIRTHDAY_DAY = 1;
  const FIRST_BIRTHDAY_YEAR = 2026;
  let lastCelebrationKey = "";
  let confettiInterval = null;
  const emojis = ["🎉","🎊","✨","💖","🎈","🌸","🥳","🎁","⭐","🍰","🩷"];
  const pad = n => String(n).padStart(2, "0");
  const currentTime = () => new Date();
  const name = () => "Oishee";
  const ageAtYear = year => Math.max(0, 17 + year - FIRST_BIRTHDAY_YEAR);

  function getBirthday(now) {
    let year = now.getFullYear();
    if (now.getMonth() > MONTH || (now.getMonth() === MONTH && now.getDate() >= BIRTHDAY_DAY)) year++;
    return new Date(year, MONTH, BIRTHDAY_DAY, 0, 0, 0, 0);
  }
  function isBirthdayDay(now) {
    return now.getMonth() === MONTH && now.getDate() === BIRTHDAY_DAY;
  }
  function launchConfetti(amount = 60) {
    for (let i = 0; i < amount; i++) {
      const piece = document.createElement("div");
      piece.className = "confetti";
      piece.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.setProperty("--drift", (Math.random() * 220 - 110) + "px");
      piece.style.animationDuration = (4 + Math.random() * 5) + "s";
      piece.style.animationDelay = (Math.random() * 1.5) + "s";
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 11000);
    }
  }
  function sidePop() {
    ["left", "right"].forEach((side, i) => {
      const pop = document.createElement("div");
      pop.className = "side-pop " + side;
      pop.textContent = i === 0 ? "🎉🥳🎊" : "🎊🎉🥳";
      pop.style.top = (12 + Math.random() * 55) + "%";
      pop.style.setProperty("--move", (side === "left" ? 120 : -120) + "vw");
      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 1500);
    });
  }
  function startCelebrationEffects() {
    const now = currentTime();
    const key = `${now.getFullYear()}-10-01`;
    if (lastCelebrationKey !== key) {
      lastCelebrationKey = key;
      launchConfetti(100);
      sidePop();
      setTimeout(() => launchConfetti(65), 1400);
    }
    if (!confettiInterval) confettiInterval = setInterval(() => {
      launchConfetti(12);
      if (Math.random() > .35) sidePop();
    }, 6500);
  }
  function stopCelebrationEffects() {
    if (confettiInterval) clearInterval(confettiInterval);
    confettiInterval = null;
  }
  function render() {
    const now = currentTime();
    const target = getBirthday(now);
    const celebrating = isBirthdayDay(now);
    const ageYear = celebrating ? now.getFullYear() :
      Math.max(FIRST_BIRTHDAY_YEAR, (now.getMonth() > MONTH || (now.getMonth() === MONTH && now.getDate() >= BIRTHDAY_DAY)) ? now.getFullYear() : now.getFullYear() - 1);
    const age = ageAtYear(ageYear);
    $("ageBadge").textContent = "currently " + age + "y";
    $("headline").textContent = celebrating ? `Happy ${age}th Birthday Dear ${name()}` : `${name()}'s Birthday countdown`;
    $("dateLine").textContent = celebrating ? "" : `October 1, ${target.getFullYear()}`;
    $("dateLine").style.display = celebrating ? "none" : "block";
    $("timer").style.display = celebrating ? "none" : "grid";
    document.body.classList.toggle("celebrating", celebrating);
    if (celebrating) startCelebrationEffects(); else stopCelebrationEffects();
    if (!celebrating) {
      const totalSeconds = Math.max(0, Math.floor((target.getTime() - now.getTime()) / 1000));
      $("days").textContent = String(Math.floor(totalSeconds / 86400)).padStart(3, "0");
      $("hours").textContent = pad(Math.floor((totalSeconds % 86400) / 3600));
      $("minutes").textContent = pad(Math.floor((totalSeconds % 3600) / 60));
      $("seconds").textContent = pad(totalSeconds % 60);
    }
  }
  render();
  setInterval(render, 1000);
})();
</script>
</body>
</html>
